<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mdbrowse</title>
  <link rel="stylesheet" href="/vendor/github-markdown.css">
  <style>
    :root { color-scheme: light dark; --bar: #f6f8fa; --border: #d0d7de; --muted: #57606a; --err: #cf222e; }
    @media (prefers-color-scheme: dark) {
      :root { --bar: #161b22; --border: #30363d; --muted: #8b949e; --err: #f85149; }
      body { background: #0d1117; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    header { position: sticky; top: 0; z-index: 1; display: flex; gap: 6px; padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--border); }
    header button { padding: 0 10px; font-size: 16px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
    #address { flex: 1; min-width: 0; padding: 6px 10px; font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--border); border-radius: 6px; background: Canvas; color: CanvasText; }
    #status { padding: 4px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); min-height: 24px; }
    main { max-width: 42rem; margin: 0 auto; padding: 32px 16px; }
    .error { color: var(--err); }
    .markdown-body { background: transparent; font-size: 17px; line-height: 1.65; }
    .doc-nav { display: flex; gap: 1.5em; margin-top: 2em; padding-top: 1em; border-top: 1px solid var(--border); }
    .doc-nav [rel="next"] { margin-left: auto; }
    .markdown-body [id], .markdown-body [name] { scroll-margin-top: 80px; }
  </style>
</head>
<body>
  <header>
    <button id="back" title="Back">&larr;</button>
    <button id="forward" title="Forward">&rarr;</button>
    <button id="reload" title="Reload">&#x21bb;</button>
    <form id="nav" style="display:contents">
      <input id="address" type="text" inputmode="url" placeholder="https://example.com/README.md" autocomplete="off" spellcheck="false" autofocus>
    </form>
    <button id="home" title="Home">&#x2302;</button>
  </header>
  <div id="status"></div>
  <main><article id="content" class="markdown-body"></article></main>
  <!--initial-result-->
  <script type="module" src="/app.js"></script>
</body>
</html>
